<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title id="page-title">𝑇𝑅⁷</title>
  <link rel="icon" id="page-icon" href="https://iili.io/qWN5VvR.md.jpg" type="image/jpeg">
  <meta name="description" content="مطور ويب متخصص في أنظمة تفاعلية عالية الأداء">
  <meta name="theme-color" content="#030000">
  <meta name="color-scheme" content="dark">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;900&family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════════
   WEBGL CANVAS — Premium Background Engine
═══════════════════════════════════════════════════════ -->
<canvas id="webgl-bg"></canvas>

<!-- ═══════════════════════════════════════
   LOADER — Cinematic Preloader
═══════════════════════════════════════════════════════ -->
<div id="loader" role="status" aria-label="جاري التحميل">
  <div class="loader-canvas">
    <div class="loader-geometry">
      <div class="geo-ring geo-ring-1"></div>
      <div class="geo-ring geo-ring-2"></div>
      <div class="geo-ring geo-ring-3"></div>
      <div class="geo-core">
        <div class="core-aura"></div>
        <img id="ldr-logo" src="https://iili.io/qWN5VvR.md.jpg" alt="TR7" class="core-logo" loading="eager">
        <div class="core-scan"></div>
      </div>
    </div>
    <div class="loader-hud">
      <div class="hud-brand" id="ldr-brand">TR<sup>7</sup></div>
      <div class="hud-status" id="ldr-status">SYSTEM INITIALIZATION</div>
      <div class="hud-track">
        <div class="track-fill" id="ldr-fill"></div>
        <div class="track-glow" id="ldr-glow"></div>
      </div>
      <div class="hud-pct" id="ldr-pct">0%</div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
   ADMIN PANEL — Hidden Crown Removed
═══════════════════════════════════════════════════════ -->
<!-- Admin access via keyboard shortcut: Ctrl+Shift+A -->
<div class="adm-overlay" id="adm-overlay" aria-hidden="true">
  <div class="adm-dialog">
    <div class="adm-header">
      <span class="adm-icon">🔐</span>
      <span>لوحة التحكم</span>
    </div>
    <div class="adm-body">
      <p class="adm-hint">أدخل رمز الوصول</p>
      <div class="adm-input-wrap">
        <input type="password" id="adm-pwd" class="adm-input" placeholder="••••••" autocomplete="off" spellcheck="false">
        <button class="adm-eye" id="adm-eye" aria-label="إظهار/إخفاء">
          <i class="fas fa-eye" id="adm-eye-icon"></i>
        </button>
      </div>
      <div class="adm-err" id="adm-err"></div>
    </div>
    <div class="adm-footer">
      <button class="adm-btn adm-btn-cancel" id="adm-cancel">إلغاء</button>
      <button class="adm-btn adm-btn-confirm" id="adm-ok">دخول</button>
    </div>
  </div>
</div>

<!-- Admin Panel Sidebar -->
<div class="adm-panel" id="adm-panel" aria-hidden="true">
  <div class="adm-panel-header">
    <span class="adm-ph-icon">🔐</span>
    <span class="adm-ph-title">إعدادات الموقع</span>
    <button class="adm-ph-close" id="adm-close" aria-label="إغلاق">✕</button>
  </div>
  <div class="adm-panel-body" id="adm-body">
    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="colors">🎨 الألوان</button>
      <button class="adm-tab" data-tab="texts">✏️ النصوص</button>
      <button class="adm-tab" data-tab="images">🖼️ الصور</button>
      <button class="adm-tab" data-tab="links">🔗 الروابط</button>
      <button class="adm-tab" data-tab="sizes">📐 الأحجام</button>
    </div>

    <!-- Colors Tab -->
    <div class="adm-tab-content active" id="tab-colors">
      <div class="adm-section-title">ألوان الموقع</div>
      <div class="adm-grid-2">
        <div class="adm-field">
          <label>خلفية الصفحة</label>
          <div class="adm-color-row">
            <input type="color" class="adm-color" data-key="colorBg" id="c-bg">
            <input type="text" class="adm-color-txt" data-color="colorBg" placeholder="#030000">
          </div>
        </div>
        <div class="adm-field">
          <label>اللون الرئيسي (نيون)</label>
          <div class="adm-color-row">
            <input type="color" class="adm-color" data-key="colorPrimary" id="c-primary">
            <input type="text" class="adm-color-txt" data-color="colorPrimary" placeholder="#ff0033">
          </div>
        </div>
        <div class="adm-field">
          <label>اللون العميق</label>
          <div class="adm-color-row">
            <input type="color" class="adm-color" data-key="colorDeep" id="c-deep">
            <input type="text" class="adm-color-txt" data-color="colorDeep" placeholder="#cc001a">
          </div>
        </div>
        <div class="adm-field">
          <label>اللون الداكن</label>
          <div class="adm-color-row">
            <input type="color" class="adm-color" data-key="colorDark" id="c-dark">
            <input type="text" class="adm-color-txt" data-color="colorDark" placeholder="#8b0000">
          </div>
        </div>
        <div class="adm-field">
          <label>لون مميز</label>
          <div class="adm-color-row">
            <input type="color" class="adm-color" data-key="colorAccent" id="c-accent">
            <input type="text" class="adm-color-txt" data-color="colorAccent" placeholder="#ff1744">
          </div>
        </div>
        <div class="adm-field">
          <label>لون النص</label>
          <div class="adm-color-row">
            <input type="color" class="adm-color" data-key="colorText" id="c-text">
            <input type="text" class="adm-color-txt" data-color="colorText" placeholder="#ffffff">
          </div>
        </div>
        <div class="adm-field">
          <label>خلفية البطاقة</label>
          <div class="adm-color-row">
            <input type="color" class="adm-color" data-key="colorCardBg" id="c-card">
            <input type="text" class="adm-color-txt" data-color="colorCardBg" placeholder="rgba(5,1,2,0.60)">
          </div>
        </div>
        <div class="adm-field">
          <label>لون الحواف</label>
          <div class="adm-color-row">
            <input type="color" class="adm-color" data-key="colorBorder" id="c-border">
            <input type="text" class="adm-color-txt" data-color="colorBorder" placeholder="rgba(255,0,51,0.18)">
          </div>
        </div>
      </div>
      <div class="adm-save-row">
        <button class="adm-btn adm-btn-reset" id="reset-colors">↺ إعادة ضبط</button>
        <button class="adm-btn adm-btn-confirm adm-save-btn" data-save="colors">💾 حفظ</button>
      </div>
    </div>

    <!-- Texts Tab -->
    <div class="adm-tab-content" id="tab-texts">
      <div class="adm-section-title">نصوص الموقع</div>
      <div class="adm-fields-col">
        <div class="adm-field"><label>عنوان الصفحة</label><input type="text" class="adm-input" data-key="pageTitle" placeholder="𝑇𝑅⁷"></div>
        <div class="adm-field"><label>الاسم الرئيسي</label><input type="text" class="adm-input" data-key="profileName" placeholder="جلال"></div>
        <div class="adm-field"><label>اللقب المهني</label><input type="text" class="adm-input" data-key="profileSubtitle" placeholder="Web Engineer & UI Architect"></div>
        <div class="adm-field"><label>قوس فتح</label><input type="text" class="adm-input" data-key="bracketOpen" placeholder="[" maxlength="3"></div>
        <div class="adm-field"><label>قوس إغلاق</label><input type="text" class="adm-input" data-key="bracketClose" placeholder="]" maxlength="3"></div>
        <div class="adm-field"><label>الوصف / البايو</label><textarea class="adm-textarea" data-key="profileDesc" rows="4"></textarea></div>
        <div class="adm-field"><label>عنوان قسم الروابط</label><input type="text" class="adm-input" data-key="sectionTitle" placeholder="تواصل"></div>
        <div class="adm-field"><label>نص شريط الغلاف</label><input type="text" class="adm-input" data-key="coverHudText" placeholder="COVER · LIVE"></div>
        <div class="adm-field"><label>نص الفوتر</label><input type="text" class="adm-input" data-key="footerCopy" placeholder="© 2026 جلال"></div>
        <div class="adm-field"><label>رابط الموقع (نص)</label><input type="text" class="adm-input" data-key="footerUrlLabel" placeholder="black3web.github.io"></div>
        <div class="adm-field"><label>رابط الموقع (URL)</label><input type="url" class="adm-input" data-key="footerUrl" placeholder="https://..."></div>
        <div class="adm-field"><label>تسمية الزوار</label><input type="text" class="adm-input" data-key="footerVisLabel" placeholder="VISITS"></div>
        <div class="adm-field"><label>نص اللودر</label><input type="text" class="adm-input" data-key="loaderBrand" placeholder="TR7"></div>
      </div>
      <div class="adm-save-row">
        <button class="adm-btn adm-btn-reset" id="reset-texts">↺ إعادة ضبط</button>
        <button class="adm-btn adm-btn-confirm adm-save-btn" data-save="texts">💾 حفظ</button>
      </div>
    </div>

    <!-- Images Tab -->
    <div class="adm-tab-content" id="tab-images">
      <div class="adm-section-title">صور الموقع</div>
      <p class="adm-hint-sm">روابط مباشرة فقط (iili.io, imgur, إلخ)</p>
      <div class="adm-fields-col">
        <div class="adm-field">
          <label>صورة الغلاف</label>
          <input type="url" class="adm-input" data-key="bannerUrl" placeholder="https://iili.io/...">
          <div class="adm-img-preview"><img id="prev-banner" src="" alt="" onerror="this.style.display='none'" onload="this.style.display='block'"></div>
        </div>
        <div class="adm-field">
          <label>صورة الملف الشخصي</label>
          <input type="url" class="adm-input" data-key="profileUrl" placeholder="https://iili.io/...">
          <div class="adm-img-preview"><img id="prev-profile" src="" alt="" onerror="this.style.display='none'" onload="this.style.display='block'"></div>
        </div>
        <div class="adm-field">
          <label>شعار اللودر</label>
          <input type="url" class="adm-input" data-key="logoUrl" placeholder="https://iili.io/...">
          <div class="adm-img-preview"><img id="prev-logo" src="" alt="" onerror="this.style.display='none'" onload="this.style.display='block'"></div>
        </div>
      </div>
      <div class="adm-save-row">
        <button class="adm-btn adm-btn-confirm adm-save-btn" data-save="images">💾 حفظ</button>
      </div>
    </div>

    <!-- Links Tab -->
    <div class="adm-tab-content" id="tab-links">
      <div class="adm-section-title">روابط التواصل</div>
      <div id="adm-links-list"></div>
      <button class="adm-btn adm-btn-add" id="adm-add-link">+ إضافة رابط</button>
      <div class="adm-save-row">
        <button class="adm-btn adm-btn-confirm adm-save-btn" data-save="links">💾 حفظ</button>
      </div>
    </div>

    <!-- Sizes Tab -->
    <div class="adm-tab-content" id="tab-sizes">
      <div class="adm-section-title">أحجام العناصر</div>
      <div class="adm-grid-2">
        <div class="adm-field"><label>حجم الصورة الشخصية (px)</label><input type="number" class="adm-input" data-key="profileSize" min="60" max="200" step="2"></div>
        <div class="adm-field"><label>ارتفاع الغلاف (px)</label><input type="number" class="adm-input" data-key="bannerHeight" min="100" max="500" step="5"></div>
        <div class="adm-field"><label>انحناء البطاقة (px)</label><input type="number" class="adm-input" data-key="cardRadius" min="0" max="60" step="2"></div>
        <div class="adm-field"><label>حجم الاسم (px)</label><input type="number" class="adm-input" data-key="nameFontSize" min="20" max="100" step="1"></div>
        <div class="adm-field"><label>حجم اللقب (px)</label><input type="number" class="adm-input" data-key="titleFontSize" min="8" max="30" step="1"></div>
        <div class="adm-field"><label>حجم الوصف (px)</label><input type="number" class="adm-input" data-key="descFontSize" min="10" max="24" step="1"></div>
        <div class="adm-field"><label>حجم الأيقونات (px)</label><input type="number" class="adm-input" data-key="iconSize" min="32" max="100" step="2"></div>
        <div class="adm-field"><label>حجم الفوتر (px)</label><input type="number" class="adm-input" data-key="footerFontSize" min="8" max="20" step="1"></div>
      </div>
      <div class="adm-save-row">
        <button class="adm-btn adm-btn-reset" id="reset-sizes">↺ إعادة ضبط</button>
        <button class="adm-btn adm-btn-confirm adm-save-btn" data-save="sizes">💾 حفظ</button>
      </div>
    </div>
  </div>
  <div class="adm-panel-footer">
    <button class="adm-btn adm-btn-reset adm-btn-full-reset" id="adm-full-reset">↺ إعادة ضبط الكل</button>
    <button class="adm-btn adm-btn-confirm adm-btn-save-all" id="adm-save-all">💾 حفظ الكل</button>
  </div>
</div>
<div class="adm-panel-backdrop" id="adm-backdrop"></div>

<!-- ═══════════════════════════════════════
   IMAGE MODAL — Premium Lightbox
═══════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="img-modal" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="modal-close" id="modal-close" aria-label="إغ
